<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ROI Calculator</title>
    <script>
      // Redirect to index.html for client-side routing
      var pathParts = window.location.pathname.split('/').filter(p => p);
      var indexPath = '/' + pathParts[0] + '/';
      if (pathParts.length > 1) {
        // Store the path that was requested so index.html can restore it
        sessionStorage.redirect = window.location.pathname;
      }
      window.location.href = indexPath;
    </script>
  </head>
  <body>
  </body>
</html>
